[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codemate"
version = "1.0.0"
description = "LLM-based Code Analysis and Evaluation Tool"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Mohanalingam M, Praveen M, Syed Amash S"}
]
dependencies = [
    "Flask>=3.0,<4",
    "python-dotenv>=1.0,<2",
    "datasets>=2.18,<6",
    "pyarrow>=14.0",
    "transformers>=4.40,<5",
    "torch>=2.0",
    "Pygments>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
