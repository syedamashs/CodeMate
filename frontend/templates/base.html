<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CodeMate{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">C</span><span>CodeMate</span></a>
    <p class="eyebrow">CODE INTELLIGENCE</p>
    <nav>
      <a class="nav-link" href="/"><span>01</span> Analyze</a>
      <a class="nav-link" href="/audit"><span>02</span> Audit</a>
      <a class="nav-link" href="/about"><span>03</span> Project info</a>
    </nav>
    <div class="sidebar-foot"><span class="status-dot"></span><span>{{ mode|upper }} ENGINE</span><small>LOCAL AI POWERED</small></div>
  </aside>
  <main class="main-content">
    <header class="topbar"><span class="mobile-brand">CodeMate</span><span class="topbar-label">CODE INTELLIGENCE WORKBENCH</span><span class="topbar-course">AI CODE REVIEW</span></header>
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
